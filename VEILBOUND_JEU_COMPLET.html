<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />

  <title>VEILBOUND — Les Visages du Monde Brisé</title>
  <style>
:root {
  color-scheme: dark;
  --ink: #f5efe4;
  --bg: #05050a;
  --panel: rgba(10, 9, 17, 0.9);
  --gold: #e8c77c;
  --violet: #9d86d7;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at 50% 30%, #1b1728 0%, #090811 50%, #020205 100%); overflow: hidden; }
body { display: grid; place-items: center; font-family: Georgia, "Times New Roman", serif; color: var(--ink); }
#app { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; box-shadow: 0 0 70px rgba(0,0,0,.85), inset 0 0 0 1px rgba(232,199,124,.2); background: #000; }
canvas { width: 100%; height: 100%; display: block; image-rendering: auto; outline: none; touch-action: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: #05050a; color: var(--gold); letter-spacing: .16em; text-transform: uppercase; transition: opacity .35s ease; pointer-events: none; }
.loading.hidden { opacity: 0; }
#touch-controls { display: none; position: absolute; inset: 0; pointer-events: none; }
#touch-controls button { pointer-events: auto; position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); color: white; background: rgba(20,17,30,.65); font: 700 12px/1 Georgia, serif; backdrop-filter: blur(5px); }
#touch-controls button[data-touch="attack"] { right: 24px; bottom: 112px; }
#touch-controls button[data-touch="power"] { right: 102px; bottom: 50px; }
#touch-controls button[data-touch="dash"] { right: 22px; bottom: 30px; }
#touch-controls button[data-touch="interact"] { right: 110px; bottom: 132px; width: 62px; height: 62px; font-size: 9px; }
#touch-stick { pointer-events: auto; position: absolute; left: 28px; bottom: 42px; width: 140px; height: 140px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(15,13,23,.45); }
#touch-stick span { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); }
@media (pointer: coarse), (max-width: 900px) { #touch-controls { display: block; } }

  <script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const loading = document.getElementById('loading');
const W = canvas.width;
const H = canvas.height;
const TILE = 40;
const TAU = Math.PI * 2;
const SAVE_KEY = 'veilbound_save_v1';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const distXY = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const angleTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const hash2 = (x, y, s = 0) => {
  let n = x * 374761393 + y * 668265263 + s * 69069;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
};
const circleHit = (a, b, extra = 0) => distXY(a.x, a.y, b.x, b.y) < (a.r || 0) + (b.r || 0) + extra;
const pointInRect = (x, y, r) => x >= r.x && y >= r.y && x <= r.x + r.w && y <= r.y + r.h;

function roundedRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function wrapText(c, text, maxWidth) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? `${line} ${word}` : word;
    if (c.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
    this.ambient = null;
    this.lastStep = 0;
  }
  ensure() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.22;
    this.master.connect(this.ctx.destination);
  }
  toggle() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.22, this.ctx.currentTime, 0.03);
  }
  tone(freq = 220, duration = 0.12, type = 'sine', volume = 0.18, slide = 0) {
    this.ensure();
    if (!this.ctx || this.muted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), now);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), now + duration);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }
  noise(duration = 0.12, volume = 0.12, cutoff = 800) {
    this.ensure();
    if (!this.ctx || this.muted) return;
    const rate = this.ctx.sampleRate;
    const buffer = this.ctx.createBuffer(1, Math.floor(rate * duration), rate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const source = this.ctx.createBufferSource();
    const filter = this.ctx.createBiquadFilter();
    const gain = this.ctx.createGain();
    filter.type = 'lowpass';
    filter.frequency.value = cutoff;
    gain.gain.value = volume;
    source.buffer = buffer;
    source.connect(filter); filter.connect(gain); gain.connect(this.master);
    source.start();
  }
  cue(name) {
    const table = {
      move: [90, .04, 'triangle', .025, 20],
      attack: [190, .08, 'sawtooth', .12, -80],
      heavy: [95, .16, 'square', .17, -40],
      hit: [120, .09, 'square', .1, -70],
      hurt: [70, .18, 'sawtooth', .18, -25],
      dash: [260, .09, 'triangle', .08, 180],
      power: [300, .25, 'sine', .16, 500],
      pickup: [520, .18, 'sine', .13, 280],
      mask: [180, .42, 'triangle', .16, 620],
      talk: [260, .05, 'triangle', .04, 30],
      select: [410, .08, 'sine', .08, 70],
      boss: [58, .65, 'sawtooth', .16, -15],
      victory: [330, .55, 'triangle', .16, 440],
      error: [90, .11, 'square', .08, -10],
      save: [610, .22, 'sine', .1, 120],
    };
    const t = table[name] || table.select;
    this.tone(...t);
    if (name === 'heavy' || name === 'hurt') this.noise(.09, .08, 500);
  }
}
const audio = new AudioEngine();

class InputManager {
  constructor() {
    this.down = new Set();
    this.pressed = new Set();
    this.released = new Set();
    this.pointer = { x: W / 2, y: H / 2, down: false, clicked: false };
    this.wheel = 0;
    this.gpPressed = new Set();
    this.gpDown = new Set();
    this.touchMove = { x: 0, y: 0 };
    this.touchActions = new Set();
    const prevent = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Tab']);
    window.addEventListener('keydown', e => {
      audio.ensure();
      if (prevent.has(e.key)) e.preventDefault();
      if (!this.down.has(e.code)) this.pressed.add(e.code);
      this.down.add(e.code);
    }, { passive: false });
    window.addEventListener('keyup', e => {
      this.down.delete(e.code);
      this.released.add(e.code);
    });
    canvas.addEventListener('pointermove', e => this.setPointer(e));
    canvas.addEventListener('pointerdown', e => {
      audio.ensure();
      this.setPointer(e); this.pointer.down = true; this.pointer.clicked = true;
      canvas.focus();
    });
    window.addEventListener('pointerup', () => { this.pointer.down = false; });
    canvas.addEventListener('wheel', e => { e.preventDefault(); this.wheel += Math.sign(e.deltaY); }, { passive: false });
    window.addEventListener('blur', () => this.down.clear());
    this.setupTouch();
  }
  setPointer(e) {
    const r = canvas.getBoundingClientRect();
    this.pointer.x = (e.clientX - r.left) * W / r.width;
    this.pointer.y = (e.clientY - r.top) * H / r.height;
  }
  setupTouch() {
    document.querySelectorAll('[data-touch]').forEach(btn => {
      const name = btn.dataset.touch;
      const start = e => { e.preventDefault(); audio.ensure(); this.touchActions.add(name); };
      const end = e => { e.preventDefault(); this.touchActions.delete(name); };
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', end);
      btn.addEventListener('pointercancel', end);
      btn.addEventListener('pointerleave', end);
    });
    const stick = document.getElementById('touch-stick');
    const knob = stick?.querySelector('span');
    if (!stick || !knob) return;
    let active = false;
    const move = e => {
      if (!active) return;
      const r = stick.getBoundingClientRect();
      let x = e.clientX - (r.left + r.width / 2);
      let y = e.clientY - (r.top + r.height / 2);
      const d = Math.hypot(x, y) || 1;
      const max = r.width * .32;
      if (d > max) { x = x / d * max; y = y / d * max; }
      this.touchMove.x = x / max; this.touchMove.y = y / max;
      knob.style.transform = `translate(${x}px,${y}px)`;
    };
    stick.addEventListener('pointerdown', e => { active = true; stick.setPointerCapture(e.pointerId); move(e); });
    stick.addEventListener('pointermove', move);
    const stop = () => { active = false; this.touchMove.x = this.touchMove.y = 0; knob.style.transform = ''; };
    stick.addEventListener('pointerup', stop); stick.addEventListener('pointercancel', stop);
  }
  pollGamepad() {
    const gp = navigator.getGamepads?.()[0];
    this.gpPressed.clear();
    if (!gp) { this.gpDown.clear(); return; }
    const next = new Set();
    gp.buttons.forEach((b, i) => { if (b.pressed) next.add(i); });
    for (const i of next) if (!this.gpDown.has(i)) this.gpPressed.add(i);
    this.gpDown = next;
    this.gp = gp;
  }
  axis() {
    let x = 0, y = 0;
    if (this.down.has('KeyA') || this.down.has('KeyQ') || this.down.has('ArrowLeft')) x--;
    if (this.down.has('KeyD') || this.down.has('ArrowRight')) x++;
    if (this.down.has('KeyW') || this.down.has('KeyZ') || this.down.has('ArrowUp')) y--;
    if (this.down.has('KeyS') || this.down.has('ArrowDown')) y++;
    if (this.gp) {
      const gx = Math.abs(this.gp.axes[0]) > .18 ? this.gp.axes[0] : 0;
      const gy = Math.abs(this.gp.axes[1]) > .18 ? this.gp.axes[1] : 0;
      x += gx; y += gy;
      if (this.gp.buttons[14]?.pressed) x--;
      if (this.gp.buttons[15]?.pressed) x++;
      if (this.gp.buttons[12]?.pressed) y--;
      if (this.gp.buttons[13]?.pressed) y++;
    }
    x += this.touchMove.x; y += this.touchMove.y;
    const d = Math.hypot(x, y);
    return d > 1 ? { x: x / d, y: y / d } : { x, y };
  }
  isDown(...codes) { return codes.some(c => this.down.has(c)); }
  wasPressed(...codes) { return codes.some(c => this.pressed.has(c)); }
  actionPressed(name) {
    const map = {
      attack: ['Space','KeyJ'], power: ['ShiftLeft','ShiftRight','KeyK'], dash: ['KeyE','KeyL'],
      interact: ['KeyF','Enter'], pause: ['Escape'], map: ['KeyM'], mute: ['KeyO']
    };
    if (this.touchActions.has(name)) {
      if (!this[`touchLatch_${name}`]) { this[`touchLatch_${name}`] = true; return true; }
    } else this[`touchLatch_${name}`] = false;
    const gpMap = { attack: 0, power: 2, dash: 1, interact: 3, pause: 9 };
    return this.wasPressed(...(map[name] || [])) || (gpMap[name] !== undefined && this.gpPressed.has(gpMap[name]));
  }
  endFrame() {
    this.pressed.clear(); this.released.clear(); this.pointer.clicked = false; this.wheel = 0;
  }
}
const input = new InputManager();

function makeGrid(w, h, fill = '.') {
  return Array.from({ length: h }, () => Array(w).fill(fill));
}
function setTile(m, x, y, t) { if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.tiles[y][x] = t; }
function rectTiles(m, x, y, w, h, t) {
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) setTile(m, xx, yy, t);
}
function frameTiles(m, x, y, w, h, t = '#') {
  for (let xx = x; xx < x + w; xx++) { setTile(m, xx, y, t); setTile(m, xx, y + h - 1, t); }
  for (let yy = y; yy < y + h; yy++) { setTile(m, x, yy, t); setTile(m, x + w - 1, yy, t); }
}
function lineTiles(m, x1, y1, x2, y2, t) {
  const dx = Math.sign(x2 - x1), dy = Math.sign(y2 - y1);
  let x = x1, y = y1;
  while (true) {
    setTile(m, x, y, t);
    if (x === x2 && y === y2) break;
    if (x !== x2) x += dx;
    if (y !== y2) y += dy;
  }
}
function carve(m, x, y, w, h, t = '.') { rectTiles(m, x, y, w, h, t); }
function pos(tx, ty) { return { x: (tx + .5) * TILE, y: (ty + .5) * TILE }; }
function makeMap(id, title, subtitle, w, h, theme = id) {
  const m = { id, title, subtitle, w, h, theme, tiles: makeGrid(w, h, '.'), entities: [], spawn: pos(3, Math.floor(h / 2)), bossArena: null };
  frameTiles(m, 0, 0, w, h, '#');
  return m;
}
function addEntity(m, type, tx, ty, data = {}) { m.entities.push({ type, ...pos(tx, ty), tx, ty, ...data }); }
function addEnemy(m, kind, tx, ty, data = {}) { addEntity(m, 'enemy', tx, ty, { kind, ...data }); }
function addPickup(m, id, tx, ty, kind = 'shard', amount = 1, data = {}) { addEntity(m, 'pickup', tx, ty, { id, kind, amount, ...data }); }
function addChest(m, id, tx, ty, amount = 3, requires = null) { addEntity(m, 'chest', tx, ty, { id, amount, requires }); }

function buildHub(state) {
  const m = makeMap('hub', 'L’Atelier des Visages', 'Entre deux identités', 38, 25, 'hub');

  rectTiles(m, 4, 4, 30, 17, 'd');

  carve(m, 17, 20, 5, 1);
  carve(m, 17, 4, 5, 1);
  // Alcôves et atelier central.
  rectTiles(m, 15, 8, 8, 7, 'o');
  frameTiles(m, 15, 8, 8, 7, '#');
  carve(m, 18, 14, 2, 1);
  rectTiles(m, 7, 7, 5, 4, 'o'); frameTiles(m, 7, 7, 5, 4, '#'); carve(m, 9, 10, 1, 1);
  rectTiles(m, 27, 7, 5, 4, 'o'); frameTiles(m, 27, 7, 5, 4, '#'); carve(m, 29, 10, 1, 1);
  rectTiles(m, 7, 14, 5, 4, 'o'); frameTiles(m, 7, 14, 5, 4, '#'); carve(m, 9, 14, 1, 1);
  rectTiles(m, 27, 14, 5, 4, 'o'); frameTiles(m, 27, 14, 5, 4, '#'); carve(m, 29, 14, 1, 1);
  // Cercle de couture.
  for (let y = 16; y <= 21; y++) for (let x = 15; x <= 23; x++) {
    const d = distXY(x, y, 19, 18.5);
    if (d < 3.2) setTile(m, x, y, 'c');
  }
  addEntity(m, 'npc', 19, 12, {

      upgrades: {}, sigils: []
    },

    playtime: 0, deaths: 0, ending: null, seenIntro: false

class Player {
  constructor(game, saved) {
    this.game = game;
    this.x = 0; this.y = 0; this.r = 15;
    this.vx = 0; this.vy = 0;
    this.facing = { x:1, y:0 };
    this.hp = saved.hp; this.maxHp = saved.maxHp;
    this.stability = saved.stability; this.maxStability = saved.maxStability;
    this.mask = saved.mask || 'anonyme';
    this.unlocked = [...(saved.unlocked || ['anonyme'])];
    this.shards = saved.shards || 0;
    this.memories = saved.memories || 0;
    this.upgrades = { ...(saved.upgrades || {}) };
    this.sigils = [...(saved.sigils || [])];
    this.attackCD = 0; this.powerCD = 0; this.dashCD = 0;
    this.dashTimer = 0; this.dashDir = { x:1, y:0 }; this.dashHit = new Set();
    this.invuln = 0; this.block = 0; this.phase = 0; this.stun = 0;
    this.lastDamage = 0; this.lastPower = 99; this.maskLock = 0;
    this.poison = 0; this.poisonTick = 0;
    this.stepTimer = 0; this.transformFlash = 0;
  }
  serialize() {
    return {
      hp:this.hp, maxHp:this.maxHp, stability:this.stability, maxStability:this.maxStability,
      mask:this.mask, unlocked:[...this.unlocked], shards:this.shards, memories:this.memories,
      upgrades:{...this.upgrades}, sigils:[...this.sigils]
    };
  }
  setPosition(p) { this.x = p.x; this.y = p.y; }
  upgraded(mask = this.mask) { return !!this.upgrades[mask]; }
  damageMultiplier() { return this.upgraded() ? 1.25 : 1; }
  powerCost(base) { return this.upgraded() ? base * .8 : base; }
  speed() {
    let s = MASKS[this.mask]?.speed || 180;
    const t = this.game.tileAtWorld(this.x, this.y);
    if (t === '~' && this.mask === 'crapaud') s *= 1.18;
    if (this.poison > 0) s *= .82;
    return s;
  }
  canAct() { return this.stun <= 0 && this.game.mode === 'playing'; }
  update(dt) {
    this.attackCD -= dt; this.powerCD -= dt; this.dashCD -= dt;
    this.invuln -= dt; this.block -= dt; this.phase -= dt; this.stun -= dt; this.maskLock -= dt;
    this.transformFlash -= dt; this.lastDamage += dt; this.lastPower += dt;
    if (this.poison > 0) {
      this.poison -= dt; this.poisonTick -= dt;
      if (this.poisonTick <= 0) { this.poisonTick = 1; this.takeDamage(.5, null, true); }
    }
    if (this.mask !== 'anonyme' && this.lastPower > .8 && this.lastDamage > 1.2) {
      this.stability = Math.min(this.maxStability, this.stability + dt * (this.upgraded() ? 15 : 11));
    } else if (this.mask === 'anonyme') {
      this.stability = Math.min(this.maxStability, this.stability + dt * 20);
    }
    if (this.stability <= 0 && this.mask !== 'anonyme') {
      this.stability = 0; this.game.forceMaskBreak();
    }
    if (!this.canAct()) return;

    const axis = input.axis();
    if (Math.hypot(axis.x, axis.y) > .1) {
      const d = Math.hypot(axis.x, axis.y) || 1;
      this.facing.x = axis.x / d; this.facing.y = axis.y / d;
    }

    if (this.dashTimer > 0) {
      this.dashTimer -= dt;
      const dashSpeed = this.mask === 'corneille' ? 720 : 590;
      this.game.moveActor(this, this.dashDir.x * dashSpeed * dt, this.dashDir.y * dashSpeed * dt, true);
      if (this.mask === 'corneille') {
        for (const e of this.game.enemies) {
          if (!e.dead && !this.dashHit.has(e) && circleHit(this, e, 10)) {
            this.dashHit.add(e); e.takeDamage(1.25 * this.damageMultiplier(), this.dashDir.x * 240, this.dashDir.y * 240, { shadow:true });
          }
        }
      }
    } else {
      const speed = this.speed();
      this.game.moveActor(this, axis.x * speed * dt, axis.y * speed * dt, false);
      if (Math.hypot(axis.x, axis.y) > .2) {
        this.stepTimer -= dt;
        if (this.stepTimer <= 0) { this.stepTimer = this.mask === 'colosse' ? .42 : .28; audio.cue('move'); this.game.spawnDust(this.x, this.y + 13, 2); }
      }
      if (input.actionPressed('dash')) this.startDash();
    }

    if (input.actionPressed('attack')) this.attack();
    if (input.actionPressed('power')) this.power();

    const tile = this.game.tileAtWorld(this.x, this.y);
    if (tile === '!' && this.mask !== 'colosse' && this.invuln <= 0) this.takeDamage(.5, null, true);
  }
  startDash(force = false) {
    if ((!force && this.dashCD > 0) || this.stun > 0) return;
    this.dashCD = this.mask === 'corneille' ? .55 : .85;
    this.dashTimer = this.mask === 'corneille' ? .28 : .18;
    this.invuln = Math.max(this.invuln, this.dashTimer + .05);
    this.dashDir = { ...this.facing };
    this.dashHit.clear();
    audio.cue('dash');
    this.game.spawnBurst(this.x, this.y, MASKS[this.mask].accent, 7, 120);
  }
  attack() {
    if (this.attackCD > 0 || this.dashTimer > 0) return;
    const mult = this.damageMultiplier();
    const fx = this.x + this.facing.x * 30;
    const fy = this.y + this.facing.y * 30;
    switch (this.mask) {
      case 'anonyme':
        this.attackCD = .28; this.game.melee(this, fx, fy, 34, 1.15 * mult, 150, MASKS.anonyme.accent); audio.cue('attack'); break;
      case 'garde':
        this.attackCD = .48; this.game.melee(this, fx, fy, 45, 1.9 * mult, 250, MASKS.garde.accent); audio.cue('heavy'); break;
      case 'corneille':
        this.attackCD = .22; this.game.melee(this, fx, fy, 32, 1.0 * mult, 130, MASKS.corneille.accent); audio.cue('attack'); break;
      case 'phalene':
        this.attackCD = .38; this.game.projectile(this, this.x + this.facing.x*20, this.y + this.facing.y*20, this.facing.x*430, this.facing.y*430, 8, 1.05*mult, 1.2, { color:MASKS.phalene.accent, kind:'dust', stun:.35 }); audio.cue('attack'); break;
      case 'crapaud':
        this.attackCD = .46; this.game.projectile(this, this.x + this.facing.x*18, this.y + this.facing.y*18, this.facing.x*520, this.facing.y*520, 7, 1.35*mult, .55, { color:MASKS.crapaud.accent, kind:'tongue', poison:2 }); audio.cue('attack'); break;
      case 'colosse':
        this.attackCD = .72; this.game.melee(this, fx, fy, 58, 2.8*mult, 390, MASKS.colosse.accent); this.game.shake = Math.max(this.game.shake, 7); audio.cue('heavy'); break;
      case 'horloger':
        this.attackCD = .4; this.game.projectile(this, this.x + this.facing.x*20, this.y + this.facing.y*20, this.facing.x*450, this.facing.y*450, 7, 1.15*mult, 1.3, { color:MASKS.horloger.accent, kind:'clock', slow:1.8 }); audio.cue('attack'); break;
      case 'spectre':
        this.attackCD = .34; this.game.projectile(this, this.x + this.facing.x*20, this.y + this.facing.y*20, this.facing.x*380, this.facing.y*380, 9, 1.25*mult, 1.45, { color:MASKS.spectre.accent, kind:'soul', pierce:2 }); audio.cue('attack'); break;
    }
  }
  spendPower(cost) {
    cost = this.powerCost(cost);
    if (this.stability < cost) { this.game.toast('Stabilité insuffisante', '#e07b7b'); audio.cue('error'); return false; }
    this.stability -= cost; this.lastPower = 0; return true;
  }
  power() {
    if (this.powerCD > 0 || this.dashTimer > 0) return;
    const mult = this.damageMultiplier();
    switch (this.mask) {
      case 'anonyme':
        if (!this.spendPower(8)) return;
        this.powerCD = .8; this.startDash(true);
        setTimeout(() => { if (this.game.mode === 'playing') this.game.melee(this, this.x, this.y, 48, 1.4*mult, 200, MASKS.anonyme.accent); }, 90);
        break;
      case 'garde':
        if (!this.spendPower(16)) return;
        this.powerCD = 1.2; this.block = this.upgraded() ? 2.2 : 1.6; this.invuln = Math.max(this.invuln, .18);
        this.game.spawnRing(this.x, this.y, MASKS.garde.accent, 72); audio.cue('power'); break;
      case 'corneille':
        if (!this.spendPower(14)) return;
        this.powerCD = .8; this.dashCD = 0; this.startDash(true); this.dashTimer = this.upgraded() ? .46 : .36; audio.cue('power'); break;
      case 'phalene':
        if (!this.spendPower(22)) return;
        this.powerCD = 1.7; this.game.areaEffect(this.x, this.y, this.upgraded()?145:120, 1.0*mult, { stun:this.upgraded()?4:3, color:MASKS.phalene.accent });
        this.game.spawnRing(this.x, this.y, MASKS.phalene.accent, this.upgraded()?145:120); audio.cue('power'); break;
      case 'crapaud':
        if (!this.spendPower(18)) return;
        this.powerCD = 1.4; this.game.puddles.push({ x:this.x+this.facing.x*55, y:this.y+this.facing.y*55, r:this.upgraded()?72:58, life:this.upgraded()?7:5, tick:0, owner:'player', damage:.45*mult, color:MASKS.crapaud.accent });
        this.game.spawnBurst(this.x+this.facing.x*55, this.y+this.facing.y*55, MASKS.crapaud.accent, 14, 120); audio.cue('power'); break;
      case 'colosse':
        if (!this.spendPower(25)) return;
        this.powerCD = 1.8; this.game.areaEffect(this.x, this.y, this.upgraded()?130:105, 2.6*mult, { knock:450, color:MASKS.colosse.accent });
        this.game.breakNearby(this.x, this.y, this.upgraded()?115:90);
        this.game.shake = 15; audio.cue('heavy'); break;
      case 'horloger':
        if (!this.spendPower(24)) return;
        this.powerCD = 2.0;
        for (const e of this.game.enemies) if (!e.dead && dist(this,e) < (this.upgraded()?180:145)) e.frozen = Math.max(e.frozen, this.upgraded()?4:3);
        this.game.repairNearby(this.x, this.y, this.upgraded()?150:110);
        this.game.spawnRing(this.x, this.y, MASKS.horloger.accent, this.upgraded()?180:145); audio.cue('power'); break;
      case 'spectre':
        if (!this.spendPower(20)) return;
        this.powerCD = 1.4; this.phase = this.upgraded()?4:2.8; this.invuln = Math.max(this.invuln, .35);
        this.game.spawnBurst(this.x, this.y, MASKS.spectre.accent, 18, 160); audio.cue('power'); break;
    }
  }
  takeDamage(amount, source = null, environmental = false) {
    if (this.invuln > 0 || this.game.mode !== 'playing') return false;
    if (this.block > 0 && !environmental) {
      this.game.spawnRing(this.x, this.y, MASKS.garde.accent, 46); audio.cue('select');
      if (source?.owner === 'enemy') {
        source.vx *= -1.2; source.vy *= -1.2; source.owner = 'player'; source.damage *= 1.4; source.color = MASKS.garde.accent;
      }
      return false;
    }
    this.hp -= amount;
    this.lastDamage = 0;
    if (this.mask !== 'anonyme') this.stability = Math.max(0, this.stability - amount * 8);
    this.invuln = environmental ? .55 : .85;
    this.game.shake = Math.max(this.game.shake, 9);
    this.game.flash = Math.max(this.game.flash, .22);
    this.game.spawnBurst(this.x, this.y, '#d86e72', 10, 140);
    this.game.floatText(this.x, this.y - 24, `-${amount % 1 ? amount.toFixed(1) : amount}`, '#ff9b9b');
    audio.cue('hurt');
    if (source && source.x !== undefined) {
      const a = angleTo(source, this);
      this.game.moveActor(this, Math.cos(a)*18, Math.sin(a)*18, false);
    }
    if (this.hp <= 0) this.game.playerDied();
    return true;
  }
  heal(v) { this.hp = Math.min(this.maxHp, this.hp + v); this.game.floatText(this.x, this.y-25, `+${v}`, '#9be5a8'); }
}

const ENEMY_STATS = {
  guard:      { hp:5, speed:92, r:15, damage:1, range:35, cooldown:1.15, color:'#7d8da1', xp:1 },
  archer:     { hp:3.5, speed:70, r:14, damage:1, range:250, cooldown:1.8, color:'#a28e76', xp:1 },
  hound:      { hp:3, speed:142, r:13, damage:1, range:28, cooldown:.85, color:'#647c5f', xp:1 },
  wisp:       { hp:3, speed:75, r:12, damage:.75, range:220, cooldown:1.5, color:'#9bb7c9', xp:1 },
  slime:      { hp:4, speed:60, r:17, damage:.75, range:30, cooldown:1.3, color:'#708f75', xp:1 },
  leech:      { hp:3.5, speed:115, r:12, damage:.75, range:26, cooldown:1.0, color:'#507b80', xp:1 },
  automaton:  { hp:8, speed:62, r:20, damage:1.5, range:42, cooldown:1.55, color:'#8a6e5e', xp:2 },
  librarian:  { hp:4, speed:68, r:14, damage:1, range:240, cooldown:1.45, color:'#827aa3', xp:1 },
  maskhunter: { hp:6, speed:110, r:16, damage:1, range:35, cooldown:1.0, color:'#6e5b79', xp:2 },
};

class Enemy {
  constructor(game, data) {
    this.game = game;
    this.x = data.x; this.y = data.y;
    this.kind = data.kind;
    this.bossKind = data.bossKind || null;
    this.name = data.name || this.kind;
    const s = this.bossKind ? { hp:data.hp||40, speed:90, r:data.r||30, damage:1.5, range:45, cooldown:1.2, color:'#b15b65', xp:8 } : ENEMY_STATS[this.kind];
    Object.assign(this, s);
    this.maxHp = this.hp;
    this.dead = false; this.remove = false;
    this.attackTimer = .6 + Math.random(); this.stateTimer = 1.2;
    this.invuln = 0; this.stun = 0; this.frozen = 0; this.slow = 0; this.poison = 0; this.poisonTick = 0;
    this.alert = false; this.hitFlash = 0; this.phase = 0; this.pattern = 0;
    this.vx = 0; this.vy = 0; this.target = null;
    this.charge = 0; this.chargeDir = {x:0,y:0}; this.telegraph = 0;
    this.summonStage = 0;
  }
  update(dt) {
    if (this.dead) return;
    this.attackTimer -= dt; this.stateTimer -= dt; this.invuln -= dt; this.stun -= dt; this.hitFlash -= dt; this.slow -= dt;
    if (this.frozen > 0) { this.frozen -= dt; return; }
    if (this.poison > 0) {
      this.poison -= dt; this.poisonTick -= dt;
      if (this.poisonTick <= 0) { this.poisonTick = .75; this.takeDamage(.3, 0, 0, { poison:true, silent:true }); }
    }
    if (this.stun > 0) return;
    if (this.bossKind) { this.updateBoss(dt); return; }
    const p = this.game.player;
    const d = dist(this, p);
    if (p.phase > 0) {
      if (d < 45) this.moveAway(p, dt, .5);
      return;
    }
    if (d < 330 || this.alert) this.alert = true;
    if (!this.alert) {
      const a = Math.sin(this.game.time*.7 + this.x*.01) * .5;
      this.game.moveActor(this, Math.cos(a)*this.speed*.15*dt, Math.sin(a)*this.speed*.15*dt);
      return;
    }
    if (this.kind === 'archer' || this.kind === 'wisp' || this.kind === 'librarian') {
      const wanted = this.kind === 'wisp' ? 165 : 205;
      if (d < wanted - 35) this.moveAway(p, dt);
      else if (d > wanted + 30) this.moveToward(p, dt);
      else this.strafe(p, dt);
      if (this.attackTimer <= 0 && d < this.range) this.shootAtPlayer();
    } else {
      if (d > this.range * .8) this.moveToward(p, dt);
      if (this.attackTimer <= 0 && d < this.range + p.r + 8) this.meleePlayer();
    }
  }
  speedNow() { return this.speed * (this.slow > 0 ? .48 : 1); }
  moveToward(target, dt, mult=1) {
    const a = angleTo(this, target);
    this.game.moveActor(this, Math.cos(a)*this.speedNow()*mult*dt, Math.sin(a)*this.speedNow()*mult*dt);
  }
  moveAway(target, dt, mult=1) {
    const a = angleTo(target, this);
    this.game.moveActor(this, Math.cos(a)*this.speedNow()*mult*dt, Math.sin(a)*this.speedNow()*mult*dt);
  }
  strafe(target, dt) {
    const a = angleTo(this, target) + Math.PI/2 * (Math.sin(this.x + this.y) > 0 ? 1 : -1);
    this.game.moveActor(this, Math.cos(a)*this.speedNow()*.55*dt, Math.sin(a)*this.speedNow()*.55*dt);
  }
  meleePlayer(mult=1) {
    this.attackTimer = this.cooldown;
    const p = this.game.player;
    this.game.enemySlash(this.x, this.y, p.x, p.y, this.r + 30, this.damage*mult, this.color);
  }
  shootAtPlayer(mult=1, opts={}) {
    this.attackTimer = this.cooldown;
    const p = this.game.player;
    const a = angleTo(this, p) + (opts.spread || 0);
    const speed = opts.speed || (this.kind === 'wisp' ? 250 : 320);
    this.game.projectile(this, this.x, this.y, Math.cos(a)*speed, Math.sin(a)*speed, opts.r||7, this.damage*mult, opts.life||2.2, {
      owner:'enemy', color:opts.color||this.color, kind:opts.kind||this.kind, drain:this.kind==='maskhunter'?10:0
    });
    audio.tone(this.kind === 'wisp' ? 420 : 170, .1, 'triangle', .05, -80);
  }
  updateBoss(dt) {
    const p = this.game.player;
    const d = dist(this,p);
    this.phase = 1 - this.hp/this.maxHp;
    if (!this.alert && d < 360) {
      this.alert = true;
      this.game.startBoss(this);
    }
    if (!this.alert) return;
    if (this.telegraph > 0) { this.telegraph -= dt; return; }
    if (this.charge > 0) {
      this.charge -= dt;
      this.game.moveActor(this, this.chargeDir.x * (this.bossKind==='doe'?520:360)*dt, this.chargeDir.y*(this.bossKind==='doe'?520:360)*dt);
      if (circleHit(this,p,4)) p.takeDamage(this.damage*1.25, this);
      return;
    }
    switch (this.bossKind) {
      case 'marshal': this.bossMarshal(dt,d); break;
      case 'doe': this.bossDoe(dt,d); break;
      case 'choir': this.bossChoir(dt,d); break;
      case 'mother': this.bossMother(dt,d); break;
      case 'prince': this.bossPrince(dt,d); break;
      case 'conservator': this.bossConservator(dt,d); break;
    }
  }
  bossMarshal(dt,d) {
    if (this.stateTimer <= 0) {
      this.pattern = (this.pattern + 1) % 3;
      this.stateTimer = this.phase > .5 ? 1.55 : 2.1;
      if (this.pattern === 1) this.radial(10 + (this.phase>.5?4:0), 235, 1, '#d8bd74');
      if (this.pattern === 2) this.beginCharge(.38);
    }
    if (this.pattern === 0) {
      this.moveToward(this.game.player,dt,.85);
      if (this.attackTimer<=0 && d<72) this.meleePlayer(1.15);
    } else this.strafe(this.game.player,dt*.5);
  }
  bossDoe(dt,d) {
    if (this.stateTimer <= 0) {
      this.pattern = (this.pattern + 1) % 3;
      this.stateTimer = this.phase>.55 ? 1.25 : 1.75;
      if (this.pattern === 0) this.beginCharge(.28);
      if (this.pattern === 1) {
        for (let i=-2;i<=2;i++) this.shootAngle(angleTo(this,this.game.player)+i*.16,360,1,'#aee3e0','lightning');
      }
      if (this.pattern === 2) this.radial(8,280,.85,'#8dc2d4');
    }
    if (this.pattern !== 0) this.strafe(this.game.player,dt*.8);
  }
  bossChoir(dt,d) {
    this.strafe(this.game.player,dt*.45);
    if (this.stateTimer <= 0) {
      this.pattern = (this.pattern + 1)%3; this.stateTimer = this.phase>.5?1.25:1.75;
      if (this.pattern===0) this.radial(12,190,1,'#67b9bd');
      if (this.pattern===1) {
        const a=angleTo(this,this.game.player); for(let i=-3;i<=3;i++) this.shootAngle(a+i*.12,280,.85,'#a7c77b','song');
      }
      if (this.pattern===2 && this.game.enemies.filter(e=>!e.dead&&!e.bossKind).length<7) {
        this.game.spawnEnemy('leech',this.x+60,this.y); this.game.spawnEnemy('wisp',this.x-60,this.y);
      }
    }
  }
  bossMother(dt,d) {
    this.moveToward(this.game.player,dt,.45);
    if (this.stateTimer<=0) {
      this.pattern=(this.pattern+1)%3; this.stateTimer=this.phase>.5?1.35:1.9;
      if(this.pattern===0){ this.game.areaWarning(this.x,this.y,115,.65,()=>this.game.enemyArea(this,115,1.5,'#e36d3b')); }
      if(this.pattern===1){ this.radial(14,210,1,'#e36d3b'); }
      if(this.pattern===2){
        const a=angleTo(this,this.game.player); for(let i=-2;i<=2;i++) this.shootAngle(a+i*.22,260,1.1,'#e4844f','fire');
      }
    }
    if(this.attackTimer<=0&&d<80)this.meleePlayer(1.3);
  }
  bossPrince(dt,d) {
    this.strafe(this.game.player,dt*.65);
    if(this.stateTimer<=0){
      this.pattern=(this.pattern+1)%4; this.stateTimer=this.phase>.55?1.05:1.55;
      if(this.pattern===0)this.radial(10,260,1,'#9b83cf');
      if(this.pattern===1)this.beginCharge(.25);
      if(this.pattern===2){const a=angleTo(this,this.game.player);for(let i=-2;i<=2;i++)this.shootAngle(a+i*.14,360,1,'#d5c2e8','soul');}
      if(this.pattern===3)this.game.areaWarning(this.x,this.y,125,.55,()=>this.game.enemyArea(this,125,1.25,'#7c63b8',12));
    }
  }
  bossConservator(dt,d) {
    this.strafe(this.game.player,dt*.55);
    const fast=this.phase>.6;
    if(this.stateTimer<=0){
      this.pattern=(this.pattern+1)%5; this.stateTimer=fast?1.0:1.45;
      if(this.pattern===0)this.radial(fast?18:14,240,1.1,'#e7c77f');
      if(this.pattern===1){const a=angleTo(this,this.game.player);for(let i=-4;i<=4;i++)this.shootAngle(a+i*.1,360,1,'#f0e7d1','shard');}
      if(this.pattern===2)this.beginCharge(.28);
      if(this.pattern===3)this.game.areaWarning(this.game.player.x,this.game.player.y,105,.7,()=>this.game.enemyAreaAt(this,this.game.player.x,this.game.player.y,105,1.5,'#b04d67',14));
      if(this.pattern===4&&this.phase>.3&&this.game.enemies.filter(e=>!e.dead&&!e.bossKind).length<5){
        this.game.spawnEnemy('maskhunter',this.x+70,this.y+30); this.game.spawnEnemy('librarian',this.x-70,this.y-30);
      }
      if(fast&&chance(.35)){
        this.game.player.stability=Math.max(0,this.game.player.stability-8);
        this.game.toast('Le Conservateur fissure votre masque', '#e7c77f');
      }
    }
  }
  beginCharge(delay=.35) {
    const a=angleTo(this,this.game.player); this.chargeDir={x:Math.cos(a),y:Math.sin(a)};
    this.telegraph=delay; this.charge=this.bossKind==='doe'?.52:.42;
    this.game.spawnLine(this.x,this.y,this.x+this.chargeDir.x*240,this.y+this.chargeDir.y*240,'#efb0a1',delay);
  }
  radial(n,speed,damage,color) {
    const off=this.game.time*.3;
    for(let i=0;i<n;i++)this.shootAngle(off+i*TAU/n,speed,damage,color,'boss');
    audio.cue('boss');
  }
  shootAngle(a,speed,damage,color,kind='boss') {
    this.game.projectile(this,this.x+Math.cos(a)*this.r,this.y+Math.sin(a)*this.r,Math.cos(a)*speed,Math.sin(a)*speed,8,damage,3,{owner:'enemy',color,kind});
  }
  takeDamage(amount,kx=0,ky=0,effect={}) {
    if(this.dead||this.invuln>0)return;
    this.hp-=amount; this.alert=true; this.hitFlash=.12;
    if(effect.stun)this.stun=Math.max(this.stun,effect.stun);
    if(effect.slow)this.slow=Math.max(this.slow,effect.slow);
    if(effect.poison)this.poison=Math.max(this.poison,effect.poison===true?2:effect.poison);
    if(!this.bossKind){ this.game.moveActor(this,kx*.025,ky*.025); }
    this.game.floatText(this.x,this.y-this.r-8,amount.toFixed(amount%1?1:0),'#fff0b0');
    this.game.spawnBurst(this.x,this.y,effect.shadow?'#8064aa':this.color,5,90);
    if(!effect.silent)audio.cue('hit');
    if(this.hp<=0)this.die();
  }
  die() {
    if(this.dead)return; this.dead=true;
    this.game.spawnBurst(this.x,this.y,this.color,this.bossKind?34:14,this.bossKind?240:150);
    if(this.bossKind)this.game.bossDefeated(this); else this.game.enemyDefeated(this);
  }
}

class Game {
  constructor() {
    this.time = 0; this.dt = 0;
    this.mode = 'title';
    this.state = freshState();
    this.player = new Player(this, this.state.player);
    this.map = null; this.enemies = [];
    this.projectiles = []; this.puddles = []; this.particles = []; this.rings = [];
    this.warnings = []; this.lines = []; this.floaters = []; this.toasts = [];
    this.camera = { x:0, y:0 }; this.shake = 0; this.flash = 0;
    this.titleIndex = 0; this.pauseIndex = 0; this.upgradeIndex = 0; this.choiceIndex = 0;
    this.returnMode = 'title'; this.mapOverlay = false; this.maskWheel = false;
    this.dialogue = null; this.maskUnlock = null; this.bossActive = null; this.bossIntro = null;
    this.victory = null; this.ending = null; this.areaTitle = 0;
    this.lastInteract = null; this.interactPrompt = '';
    this.hasSave = this.readSave(false) !== null;
    this.introIndex = 0;
    this.introSlides = [
      { title:'LE GRAND EFFACEMENT', text:'Lorsque les noms commencèrent à disparaître, le monde enferma ses souvenirs dans des masques.', icon:'crack' },
      { title:'LE CONSERVATEUR', text:'Un homme promit de mettre fin au doute : un visage pour chaque vie, un rôle impossible à quitter.', icon:'crown' },
      { title:'L’ANONYME', text:'Votre propre visage fut entièrement effacé. Vous seul pouvez porter plusieurs identités sans disparaître.', icon:'mask' },
      { title:'VEILBOUND', text:'Recousez les cinq Sceaux Primordiaux. Choisissez ce qui doit survivre derrière chaque visage.', icon:'thread' }
    ];
    this.menuRects = [];

  updateProjectiles(dt){
    for(const p of this.projectiles){
      p.life-=dt;p.trail-=dt;if(p.life<=0){p.remove=true;continue;}
      const steps=Math.max(1,Math.ceil(Math.hypot(p.vx*dt,p.vy*dt)/16));
      for(let s=0;s<steps&&!p.remove;s++){
        p.x+=p.vx*dt/steps;p.y+=p.vy*dt/steps;
        const t=this.tileAtWorld(p.x,p.y);
        if(t==='#'||t==='B'||t==='Q'||(t==='G'&&!this.state.flags.boss_city)||(t==='S'&&p.kind!=='soul')){p.remove=true;break;}
        if(p.owner==='player'){
          for(const e of this.enemies){
            if(e.dead||p.hit.has(e)||!circleHit(p,e))continue;
            p.hit.add(e);e.takeDamage(p.damage,p.vx*.45,p.vy*.45,{stun:p.stun,slow:p.slow,poison:p.poison});
            if(p.pierce>0)p.pierce--;else{p.remove=true;break;}
          }
        }else if(circleHit(p,this.player)){
          const before=p.owner;const hit=this.player.takeDamage(p.damage,p);
          if(hit&&p.drain)this.player.stability=Math.max(0,this.player.stability-p.drain);
          if(p.owner===before)p.remove=true;
        }
      }
      if(p.trail<=0){p.trail=.035;this.particles.push({x:p.x,y:p.y,vx:-p.vx*.05,vy:-p.vy*.05,life:.25,max:.25,color:p.color,size:p.r*.55,gravity:0});}
    }
    this.projectiles=this.projectiles.filter(p=>!p.remove);
  }
  updatePuddles(dt){
    for(const p of this.puddles){
      p.life-=dt;p.tick-=dt;
      if(p.tick<=0){p.tick=.55;
        if(p.owner==='player')for(const e of this.enemies)if(!e.dead&&distXY(p.x,p.y,e.x,e.y)<p.r+e.r)e.takeDamage(p.damage,0,0,{poison:2,silent:true});
        else if(distXY(p.x,p.y,this.player.x,this.player.y)<p.r+this.player.r)this.player.takeDamage(p.damage,{x:p.x,y:p.y});
      }
      if(chance(dt*12))this.particles.push({x:p.x+(Math.random()*2-1)*p.r,y:p.y+(Math.random()*2-1)*p.r*.5,vx:0,vy:-20,life:.6,max:.6,color:p.color,size:3+Math.random()*4,gravity:-5});
    }
    this.puddles=this.puddles.filter(p=>p.life>0);
  }
  updateWarnings(dt){

  }
  updateVisualFX(dt){
    for(const p of this.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.gravity||0)*dt;p.vx*=Math.pow(.08,dt);p.vy*=Math.pow(.22,dt);}
    this.particles=this.particles.filter(p=>p.life>0);
    for(const r of this.rings)r.life-=dt;this.rings=this.rings.filter(r=>r.life>0);
    for(const l of this.lines)l.life-=dt;this.lines=this.lines.filter(l=>l.life>0);
    for(const f of this.floaters){f.life-=dt;f.y-=dt*30;}this.floaters=this.floaters.filter(f=>f.life>0);

  collectPickups(){
    if(!this.map)return;

      if(e.type!=='pickup'||e.collected||this.state.collected[e.id])continue;
      if(distXY(e.x,e.y,this.player.x,this.player.y)>28+this.player.r)continue;
      e.collected=true;this.state.collected[e.id]=true;
      const label=e.label||({shard:'Éclat de mémoire',memory:'Fragment de souvenir',heart:'Cœur de mémoire',stability:'Éclat de stabilité'}[e.kind]||'Objet');
      if(e.kind==='shard')this.player.shards+=e.amount||1;
      if(e.kind==='memory'){this.player.memories+=e.amount||1;this.player.shards+=2;}
      if(e.kind==='heart'){this.player.maxHp+=2;this.player.hp=this.player.maxHp;if(e.id==='gift_health')this.state.flags.gift_health=true;}
      if(e.kind==='stability'){this.player.maxStability+=20;this.player.stability=this.player.maxStability;}
      this.toast(label,e.kind==='heart'?'#e8868e':'#e8c77c');this.floatText(e.x,e.y-24,label,'#f5e3a1');
      this.spawnBurst(e.x,e.y,e.kind==='heart'?'#e8868e':'#e8c77c',18,150);audio.cue('pickup');this.saveGame(false);
    }
  }
  updateInteraction(){
    this.lastInteract=null;this.interactPrompt='';let best=999;
    for(const e of this.map.entities){
      if(e.collected||this.state.collected[e.id]&&(e.type==='chest'||e.type==='pickup'))continue;
      if(!['npc','portal','shrine','chest','loom','savepoint','sigilPedestal','endingPedestal'].includes(e.type))continue;
      const d=distXY(e.x,e.y,this.player.x,this.player.y);if(d<72&&d<best){best=d;this.lastInteract=e;}
    }
    if(this.lastInteract){
      const verbs={npc:'PARLER',portal:'TRAVERSER',shrine:'REVÊTIR',chest:'OUVRIR',loom:'ÉVEILLER',savepoint:'SE RECUEILLIR',sigilPedestal:'EXAMINER',endingPedestal:'CHOISIR'};
      this.interactPrompt=`F / Y  ${verbs[this.lastInteract.type]||'INTERAGIR'}`;
    }

  interact(e){
    audio.cue('talk');
    if(e.type==='npc'){this.interactNPC(e);return;}
    if(e.type==='portal'){
      let ok=true;
      if(e.requires==='all_sigils')ok=this.player.sigils.length>=5&&this.state.flags.boss_archives;
      else if(e.requires)ok=!!this.state.flags[e.requires];
      if(!ok){
        const msg=e.requires==='all_sigils'?'Le portail exige les cinq Sceaux Primordiaux.':'Le fil de ce portail n’est pas encore recousu.';
        this.startDialogue('Portail assoupi',[msg]);return;
      }
      this.enterMap(e.target);return;
    }
    if(e.type==='shrine'){this.unlockMask(e.mask);return;}
    if(e.type==='chest'){
      if(this.state.collected[e.id])return;
      if(e.requires&&this.player.mask!==e.requires){this.toast(`Ce coffre reconnaît ${MASKS[e.requires].name}`,'#e07b7b');audio.cue('error');return;}
      this.state.collected[e.id]=true;e.collected=true;this.player.shards+=e.amount||3;this.player.heal(1);
      this.spawnBurst(e.x,e.y,'#e8c77c',20,170);this.toast(`Coffre : +${e.amount||3} éclats`,'#e8c77c');audio.cue('pickup');this.saveGame(false);return;
    }
    if(e.type==='loom'){
      if(this.player.unlocked.length<=1){this.startDialogue('Métier de couture',['Aucun masque ne peut encore être éveillé.']);return;}
      this.upgradeIndex=0;this.mode='upgrade';return;
    }
    if(e.type==='savepoint'){
      this.player.hp=this.player.maxHp;this.player.stability=this.player.maxStability;this.state.checkpoint={mapId:this.map.id,x:this.player.x,y:this.player.y};
      this.saveGame(true);this.spawnRing(e.x,e.y,'#e8c77c',100);return;
    }
    if(e.type==='sigilPedestal'){this.startDialogue(`Sceau de ${e.sigil}`,[`Le Sceau de ${e.sigil} répond aux autres fragments déjà cousus dans votre âme.`]);return;}
    if(e.type==='endingPedestal')this.startEndingChoice();
  }
  interactNPC(e){
    const m=this.player.mask;
    if(!e.dynamic){this.startDialogue(e.name,e.lines||['Le masque ne répond pas.']);return;}
    let lines=[];
    if(e.dynamic==='cityGate')lines=m==='garde'?
      ['Capitaine… votre visage est enregistré. La porte vous reconnaîtra.','Ne laissez pas le Maréchal entendre votre véritable voix.']:
      ['Halte. Seuls les officiers de la Cloche peuvent franchir le mur militaire.','Le sanctuaire du Garde se trouve dans les faubourgs.'];
    if(e.dynamic==='crowGuild'){
      if(m==='corneille'){
        lines=this.state.flags.crow_reward?['Toujours les mêmes plumes. Toujours une autre personne dessous.']:[
          'Cette démarche… ces serres… La Corneille est revenue.',
          'Prenez ceci avant que les cloches ne comprennent la supercherie.'
        ];
        if(!this.state.flags.crow_reward){this.state.flags.crow_reward=true;this.player.shards+=4;this.saveGame(false);}
      }else lines=['Je ne parle pas aux visages officiels. Trouvez des plumes, puis revenez.'];
    }
    if(e.dynamic==='forestHint')lines=m==='phalene'?['La lune vous porte. Même le vide devra vous laisser passer.']:['La Phalène dort plus loin. Sa poussière fait naître des chemins au-dessus du ravin.'];
    if(e.dynamic==='marshHint')lines=m==='crapaud'?['Sous l’eau, écoutez les voix séparément. Le Chœur déteste qu’on distingue ses chanteurs.']:['Ces eaux avalent tous les visages, sauf celui du Crapaud des Profondeurs.'];
    if(e.dynamic==='forgeHint')lines=m==='colosse'?['Votre poids peut briser la vieille paroi. Plus loin, seul l’Horloger saura recoudre le gouffre.']:['La forge n’obéit plus aux mains légères. Cherchez un corps de cendre.'];
    if(e.dynamic==='archiveHint')lines=m==='spectre'?['Activez votre Phase obscure devant les cloisons marquées d’un œil. Elles ne retiennent que les corps.']:['Brisez d’abord la serrure avec le Colosse. Le Spectre vous attend derrière les rayonnages.'];
    if(e.dynamic==='palaceHint')lines=['Chaque seuil répète une leçon : identité, envol, profondeur, force, temps et oubli.','Le Conservateur croit que vos masques sont des chaînes. Faites-en une langue.'];
    this.startDialogue(e.name,lines);

  getObjective(){
    if(!this.map)return'';
    const id=this.map.id;
    if(id==='hub'){
      if(!this.state.flags.boss_city)return'Traverser le portail de la Cité des Cloches.';
      if(!this.state.flags.boss_forest)return'Rejoindre la Forêt Renversée.';
      if(!this.state.flags.boss_marsh)return'Explorer les Marais aux Mille Reflets.';
      if(!this.state.flags.boss_forge)return'Entrer dans la Forge des Géants.';
      if(!this.state.flags.boss_archives)return'Retrouver le Sceau du Nom dans les Archives.';
      if(!this.state.flags.finalDefeated)return'Ouvrir le Palais avec les cinq Sceaux.';
      return'Le monde attend le prochain visage que vous choisirez.';
    }
    if(this.state.flags[`boss_${id}`]||id==='palace'&&this.state.flags.finalDefeated)return'Retourner à l’Atelier par un portail cousu.';
    const maskNeed={city:'garde',forest:'phalene',marsh:'crapaud',forge:'colosse',archives:'spectre'}[id];
    if(maskNeed&&!this.player.unlocked.includes(maskNeed))return`Trouver le masque : ${MASKS[maskNeed].name}.`;
    if(id==='forge'&&!this.player.unlocked.includes('horloger'))return'Trouver l’Horloger Fendu au-delà du mur de cendre.';
    if(id==='palace')return'Franchir les six seuils et vaincre le Conservateur.';
    return`Atteindre et vaincre ${BOSS_INFO[id]?.name||'le gardien'}.`;
  }

  render(){
    ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
    if(this.mode==='title'){this.renderTitle();return;}
    if(this.mode==='intro'){this.renderIntro();return;}

    if(this.mode==='credits'&&this.returnMode==='title'){this.renderTitleBackground();this.renderCredits();return;}
    if(this.map)this.renderWorld();else this.renderTitleBackground();
    if(this.mode==='dialogue')this.renderDialogue();
    if(this.mode==='maskUnlock')this.renderMaskUnlock();
    if(this.mode==='pause')this.renderPause();
    if(this.mode==='controls')this.renderControls();
    if(this.mode==='credits')this.renderCredits();
    if(this.mode==='upgrade')this.renderUpgrade();
    if(this.mode==='map')this.renderMapOverlay();
    if(this.mode==='bossIntro')this.renderBossIntro();
    if(this.mode==='victory')this.renderVictory();
    if(this.mode==='choice')this.renderChoice();
    if(this.mode==='ending')this.renderEnding();
    if(this.mode==='gameover')this.renderGameOver();
  }

  renderWorld(){

    const labels={hub:'Atelier',city:'Cité',forest:'Forêt',marsh:'Marais',forge:'Forge',archives:'Archives',palace:'Palais'};for(const [id,p]of Object.entries(nodes)){const un=this.nodeUnlocked(id),done=id==='palace'?this.state.flags.finalDefeated:id==='hub'?false:this.state.flags[`boss_${id}`],here=this.map.id===id;ctx.fillStyle=here?'#e8c77c':done?'#7fc49a':un?'#786b86':'#302d35';ctx.beginPath();ctx.arc(p[0],p[1],here?28:22,0,TAU);ctx.fill();ctx.strokeStyle=here?'#fff1c9':'rgba(255,255,255,.25)';ctx.stroke();ctx.fillStyle=un?'#eee3d6':'#817984';ctx.font='700 15px Georgia';ctx.fillText(labels[id],p[0],p[1]+48);if(done){ctx.fillStyle='#d9f0df';ctx.font='16px Georgia';ctx.fillText('✓',p[0],p[1]+5);}}
    ctx.fillStyle='#d8cec8';ctx.font='16px Georgia';ctx.fillText(this.getObjective(),W/2,H-100);ctx.fillStyle='#e8c77c';ctx.font='14px Georgia';ctx.fillText('M / Échap / B-Rond pour fermer',W/2,H-70);
  }
  nodeUnlocked(id){if(id==='hub'||id==='city')return true;if(id==='forest')return!!this.state.flags.boss_city;if(id==='marsh')return!!this.state.flags.boss_forest;if(id==='forge')return!!this.state.flags.boss_marsh;if(id==='archives')return!!this.state.flags.boss_forge;if(id==='palace')return this.player.sigils.length>=5;return false;}
  renderBossIntro(){
    ctx.fillStyle='rgba(3,2,7,.68)';ctx.fillRect(0,0,W,H);const e=this.bossIntro.enemy,a=clamp(1-this.bossIntro.timer/2.35,0,1);ctx.save();ctx.globalAlpha=Math.sin(Math.min(1,a)*Math.PI);ctx.textAlign='center';ctx.fillStyle='#e8c77c';ctx.font='700 15px Georgia';ctx.fillText('GARDIEN DU SCEAU',W/2,H/2-52);ctx.fillStyle='#f5e9d8';ctx.font='700 36px Georgia';ctx.fillText(e.name,W/2,H/2);ctx.strokeStyle='rgba(232,199,124,.55)';ctx.beginPath();ctx.moveTo(W/2-240,H/2+24);ctx.lineTo(W/2+240,H/2+24);ctx.stroke();ctx.restore();
  }
  renderVictory(){
    ctx.fillStyle='rgba(3,2,7,.66)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#e8c77c';ctx.font='700 18px Georgia';ctx.fillText(this.victory.mapId==='palace'?'LE TRÔNE EST VIDE':'SCEAU PRIMORDIAL RECOUSU',W/2,H/2-70);ctx.fillStyle='#f4ead9';ctx.font='700 40px Georgia';ctx.fillText(this.victory.mapId==='palace'?'LE CONSERVATEUR EST TOMBÉ':`SCEAU DE ${this.victory.sigil.toUpperCase()}`,W/2,H/2-10);ctx.fillStyle='#d4c7c4';ctx.font='18px Georgia';ctx.fillText('+5 éclats  •  Vie restaurée  •  Sauvegarde automatique',W/2,H/2+42);if(this.victory.timer<=0){ctx.fillStyle='#e8c77c';ctx.font='15px Georgia';ctx.fillText('Entrée / A pour continuer',W/2,H/2+100);}
  }
  renderChoice(){
    ctx.fillStyle='rgba(3,2,7,.82)';ctx.fillRect(0,0,W,H);this.panel(95,65,W-190,H-130,.97);ctx.textAlign='center';ctx.fillStyle='#e8c77c';ctx.font='700 18px Georgia';ctx.fillText(this.choice.title,W/2,120);ctx.fillStyle='#e8ded4';ctx.font='20px Georgia';const ls=wrapText(ctx,this.choice.text,850);ls.forEach((l,i)=>ctx.fillText(l,W/2,165+i*30));
    const n=this.choice.options.length,w=300,gap=28,total=n*w+(n-1)*gap,start=W/2-total/2;this.choice.options.forEach((o,i)=>{const x=start+i*(w+gap),y=300,active=i===this.choiceIndex;ctx.fillStyle=active?'rgba(232,199,124,.13)':'rgba(255,255,255,.035)';roundedRect(ctx,x,y,w,190,12);ctx.fill();ctx.strokeStyle=active?'#e8c77c':'rgba(255,255,255,.12)';ctx.stroke();ctx.fillStyle=active?'#f4e4c2':'#b7afb5';ctx.font='700 22px Georgia';ctx.fillText(o.title,x+w/2,y+55);ctx.fillStyle='#d3c9c7';ctx.font='16px Georgia';const lines=wrapText(ctx,o.text,w-48);lines.forEach((l,j)=>ctx.fillText(l,x+w/2,y+98+j*26));});ctx.fillStyle='#bdb2b7';ctx.font='14px Georgia';ctx.fillText('← → choisir  •  Entrée / A confirmer',W/2,H-92);
  }
  renderEnding(){
    ctx.fillStyle='#05040a';ctx.fillRect(0,0,W,H);const kind=this.ending.kind;const color=kind==='libre'?'#9cd2ae':kind==='sans_masque'?'#d5c9b3':'#d0a369';
    ctx.save();ctx.textAlign='center';ctx.globalAlpha=.26;for(let i=0;i<8;i++){const a=i*TAU/8+this.time*.05;this.drawMaskIcon(MASK_ORDER[i],W/2+Math.cos(a)*300,H/2+Math.sin(a)*170,42,1);}ctx.globalAlpha=1;ctx.fillStyle=color;ctx.font='700 18px Georgia';ctx.fillText('CONCLUSION',W/2,150);ctx.fillStyle='#f3eadf';ctx.font='700 42px Georgia';ctx.fillText(this.ending.title,W/2,215);ctx.fillStyle='#d8cfd0';ctx.font='21px Georgia';const lines=wrapText(ctx,this.ending.text,820);lines.forEach((l,i)=>ctx.fillText(l,W/2,300+i*34));ctx.fillStyle='#e8c77c';ctx.font='15px Georgia';ctx.fillText(`Sceaux : ${this.player.sigils.length}/5  •  Souvenirs : ${this.player.memories}  •  Temps : ${this.formatTime(this.state.playtime)}`,W/2,530);ctx.fillStyle='rgba(255,255,255,.52)';ctx.fillText('Entrée / A pour retourner dans le monde',W/2,610);ctx.restore();
  }
  renderGameOver(){
    ctx.fillStyle='rgba(20,3,8,.76)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#d66c76';ctx.font='700 46px Georgia';ctx.fillText('LE VISAGE SE FISSURE',W/2,H/2-50);ctx.fillStyle='#e3d9d2';ctx.font='19px Georgia';ctx.fillText('L’Anonyme se recoud au dernier seuil traversé.',W/2,H/2+5);ctx.fillStyle='#e8c77c';ctx.font='15px Georgia';ctx.fillText('Entrée / A pour recommencer  •  Échap pour le titre',W/2,H/2+70);
  }
  formatTime(sec){sec=Math.floor(sec||0);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h} h ${String(m).padStart(2,'0')} min`:`${m} min ${String(s).padStart(2,'0')} s`;}
}

// Les gouffres temporels ne peuvent pas être contournés par la Phalène.
const _forgeBuilder=MAP_BUILDERS.forge;
MAP_BUILDERS.forge=(state)=>{
  const m=_forgeBuilder(state);
  for(let y=1;y<m.h-1;y++)for(let x=34;x<=39;x++)if(m.tiles[y][x]==='V')m.tiles[y][x]='Q';
  for(let y=10;y<=14;y++)for(let x=34;x<=39;x++)m.tiles[y][x]='R';
  return m;
};
const _palaceBuilder=MAP_BUILDERS.palace;
MAP_BUILDERS.palace=(state)=>{
  const m=_palaceBuilder(state);
  for(let y=1;y<m.h-1;y++)for(let x=53;x<=57;x++)if(m.tiles[y][x]==='V')m.tiles[y][x]='Q';
  for(let y=11;y<=15;y++)for(let x=53;x<=57;x++)m.tiles[y][x]='R';
  return m;
};

const game = new Game();
window.VEILBOUND = game;
})();
